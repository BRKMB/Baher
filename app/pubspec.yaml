name: bubsub_app
description: BUB SUB — native subscription manager & cancellation platform (iOS + Android).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  go_router: ^15.1.2
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.1.0
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1
  collection: ^1.19.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/logos/
    - assets/logos/svg/
    - assets/logos/marks/
    - assets/i18n/
    - assets/brand/
