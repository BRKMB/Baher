<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #14110e;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #14110e;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            105deg,
            rgba(12, 11, 10, 0.92) 0%,
            rgba(12, 11, 10, 0.78) 38%,
            rgba(12, 11, 10, 0.35) 68%,
            rgba(12, 11, 10, 0.55) 100%
          ),
          url('/images/hero.jpg') center / cover no-repeat;
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.08;
        background-image: radial-gradient(rgba(255, 255, 255, 0.35) 0.5px, transparent 0.5px);
        background-size: 3px 3px;
        pointer-events: none;
      }
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(212, 181, 106, 0.35);
        pointer-events: none;
      }
      .frame::before,
      .frame::after {
        content: '';
        position: absolute;
        width: 18px;
        height: 18px;
        border-color: #d4b56a;
        border-style: solid;
      }
      .frame::before {
        top: -1px;
        left: -1px;
        border-width: 2px 0 0 2px;
      }
      .frame::after {
        right: -1px;
        bottom: -1px;
        border-width: 0 2px 2px 0;
      }
      .content {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px 56px;
      }
      .eyebrow {
        font-family: Outfit, system-ui, sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #d4b56a;
      }
      .brand {
        margin-top: 18px;
        font-family: 'Great Vibes', cursive;
        font-size: 118px;
        line-height: 1.15;
        color: #f6f1e6;
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      }
      .headline {
        margin-top: 10px;
        max-width: 620px;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 42px;
        font-weight: 500;
        font-style: italic;
        line-height: 1.15;
        color: rgba(246, 241, 230, 0.92);
      }
      .footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
      }
      .meta {
        font-family: Outfit, system-ui, sans-serif;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.04em;
        color: rgba(246, 241, 230, 0.72);
      }
      .meta strong {
        display: block;
        margin-bottom: 6px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #d4b56a;
      }
      .url {
        font-family: Outfit, system-ui, sans-serif;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: #f6f1e6;
        border-bottom: 1px solid rgba(212, 181, 106, 0.55);
        padding-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bg"></div>
      <div class="grain"></div>
      <div class="frame"></div>
      <div class="content">
        <div>
          <p class="eyebrow">Restaurant · Warsaw</p>
          <h1 class="brand">Saluté 21</h1>
          <p class="headline">Egyptian soul. Wood-fired plates. A table waiting for you.</p>
        </div>
        <div class="footer">
          <div class="meta">
            <strong>Visit us</strong>
            ul. Marcina Kasprzaka 24A · Warszawa Wola
          </div>
          <div class="url">salute21.com</div>
        </div>
      </div>
    </div>
  </body>
</html>
