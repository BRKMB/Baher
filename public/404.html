<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nie znaleziono strony — Clean & Speak</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F6F3ED" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/i18n-boot.js"></script>
    <script src="/js/site-config.js" defer></script>
    <script src="/js/i18n.js" defer></script>
    <script src="/js/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#tresc">Przejdź do treści</a>
    <header class="site-header" data-header>
      <div class="site-header__bar">
        <a class="logo" href="/" aria-label="Clean & Speak — strona główna">
          <img class="logo__mark" src="/favicon.svg" alt="" width="30" height="30" />
          <span class="logo__word">Clean <i>&amp;</i> Speak</span>
        </a>
        <div class="site-header__tools">
          <a class="btn btn--primary btn--nav" href="/kontakt/">Skontaktuj się</a>
          <button class="lang-toggle" type="button" data-lang-toggle aria-label="Switch the website to English" title="English">
            <span class="flag flag--gb" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>
    <main id="tresc" class="error-page wrap">
      <p class="eyebrow">404</p>
      <h1>Tej strony nie ma.</h1>
      <p class="lede error-copy">Może została przeniesiona. Zostały dwie pewne drogi: sprzątanie albo angielski.</p>
      <div class="hero__actions">
        <a class="btn btn--clean" href="/sprzatanie/">Sprzątanie</a>
        <a class="btn btn--speak" href="/angielski/">Angielski</a>
        <a class="btn btn--ghost" href="/">Wróć na stronę główną</a>
      </div>
    </main>
  </body>
</html>
